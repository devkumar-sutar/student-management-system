
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Student Management System</h1>
            <p>Manage your student records easily</p>
        </header>

        <!-- Dashboard Cards -->
        <section class="dashboard">
            <div class="dashboard-card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Courses</h3>
                <p id="totalCourses">0</p>
            </div>

            <div class="dashboard-card">
                <h3>Filtered Results</h3>
                <p id="filteredStudents">0</p>
            </div>
        </section>

        <!-- Student Form -->
        <section class="form-card">
            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">
                <input type="hidden" id="studentId">

                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter full name" required
                       maxlength="100">

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter email address" required
                       maxlength="150">

                <label for="course">Course</label>
                <input type="text" id="course"
                       placeholder="Enter course" required
                       maxlength="100">

                <div class="form-actions">
                    <button type="submit" id="submitBtn">
                        Add Student
                    </button>
                    <button type="button" id="cancelBtn" hidden>
                        Cancel
                    </button>
                </div>
            </form>

            <p id="message" role="status"></p>
        </section>

        <!-- Student Records -->
        <section class="table-card">
            <div class="records-header">
                <h2>Student Records</h2>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search by name, email or course..."
                    aria-label="Search student records">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>

            <p id="emptyMessage" hidden>No students found.</p>
        </section>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
